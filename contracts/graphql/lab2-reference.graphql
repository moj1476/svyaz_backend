scalar DateTime
scalar JSON
scalar Long

enum UserStatus { PENDING ACTIVE DISABLED DELETED }
enum MemberStatus { INVITED ACTIVE SUSPENDED REMOVED }
enum ConversationType { DIRECT GROUP CHANNEL }
enum ConversationVisibility { PUBLIC PRIVATE }
enum MessageStatus { SENT EDITED DELETED }
enum FileStatus { PENDING READY QUARANTINED DELETED }
enum CallMode { AUDIO VIDEO }
enum CallStatus { RINGING ACTIVE ENDED FAILED }

interface Node { id: ID! }
type PageInfo { endCursor: String hasNextPage: Boolean! }
type OperationError { code: String! message: String! field: String retryable: Boolean! }

type User implements Node {
  id: ID!
  displayName: String!
  avatarFileId: ID
  status: UserStatus!
}

type Session implements Node {
  id: ID!
  device: Device
  status: String!
  createdAt: DateTime!
  expiresAt: DateTime!
  lastSeenAt: DateTime!
}

type Workspace implements Node {
  id: ID!
  name: String!
  slug: String!
  status: String!
  myMembership: Membership!
  policy: WorkspacePolicy!
}

type Membership implements Node {
  id: ID!
  user: User!
  role: Role!
  status: MemberStatus!
  teams: [Team!]!
  joinedAt: DateTime
}

type Role implements Node {
  id: ID!
  code: String!
  name: String!
  systemRole: Boolean!
  permissions: [Permission!]!
}

type Conversation implements Node {
  id: ID!
  workspaceId: ID!
  type: ConversationType!
  title: String
  visibility: ConversationVisibility!
  status: String!
  members(first: Int = 50, after: String): MembershipConnection!
  unreadCount: Int!
}

type Message implements Node {
  id: ID!
  conversationId: ID!
  sender: User!
  sequence: Long!
  body: String
  status: MessageStatus!
  threadRootId: ID
  attachments: [Attachment!]!
  reactions: [ReactionSummary!]!
  sentAt: DateTime!
  editedAt: DateTime
}

type File implements Node {
  id: ID!
  name: String!
  mimeType: String!
  sizeBytes: Long!
  status: FileStatus!
  downloadUrl: String
}

type Notification implements Node {
  id: ID!
  workspaceId: ID!
  type: String!
  targetType: String!
  targetId: ID!
  preview: JSON!
  createdAt: DateTime!
  readAt: DateTime
}

type Presence { userId: ID! status: String! lastHeartbeat: DateTime! }
type Call implements Node {
  id: ID!
  conversationId: ID!
  mode: CallMode!
  status: CallStatus!
  participants: [CallParticipant!]!
  startedAt: DateTime
  endedAt: DateTime
}

type AuditEvent implements Node {
  id: ID!
  actorId: ID
  action: String!
  targetType: String!
  targetId: ID
  outcome: String!
  occurredAt: DateTime!
  metadata: JSON!
}

input RegisterInput {
  email: String!
  password: String!
  displayName: String!
  invitationToken: String
  idempotencyKey: String!
}
input LoginInput { email: String! password: String! device: DeviceInput! }
input DeviceInput { platform: String! name: String! publicKey: String }
input UpdateProfileInput { displayName: String avatarFileId: ID expectedVersion: Long! }

input CreateWorkspaceInput { name: String! slug: String! idempotencyKey: String! }
input InviteMemberInput {
  workspaceId: ID!
  email: String!
  roleId: ID!
  teamId: ID
  expiresAt: DateTime!
  idempotencyKey: String!
}
input ChangeMemberRoleInput {
  workspaceId: ID!
  membershipId: ID!
  roleId: ID!
  expectedVersion: Long!
  actionId: String!
}
input UpdateWorkspacePolicyInput {
  workspaceId: ID!
  mfaRequired: Boolean
  guestPolicy: JSON
  retentionDays: Int
  fileRules: JSON
  channelRules: JSON
  expectedVersion: Long!
  actionId: String!
}

input CreateConversationInput {
  workspaceId: ID!
  type: ConversationType!
  title: String
  visibility: ConversationVisibility!
  memberIds: [ID!]!
  idempotencyKey: String!
}
input SendMessageInput {
  conversationId: ID!
  clientMessageId: ID!
  body: String!
  threadRootId: ID
  fileIds: [ID!]! = []
}
input EditMessageInput {
  messageId: ID!
  body: String!
  expectedVersion: Long!
  idempotencyKey: String!
}
input SetReactionInput { messageId: ID! emoji: String! active: Boolean! }
input MarkReadInput { conversationId: ID! sequence: Long! }

input CreateUploadInput {
  workspaceId: ID!
  name: String!
  mimeType: String!
  sizeBytes: Long!
  checksumSha256: String
  encryptionMode: String! = "MANAGED"
  idempotencyKey: String!
}
input FinalizeUploadInput { uploadId: ID! checksumSha256: String idempotencyKey: String! }
input NotificationPreferenceInput {
  workspaceId: ID
  eventType: String!
  channel: String!
  enabled: Boolean!
  quietHours: JSON
}
input StartCallInput {
  conversationId: ID!
  mode: CallMode!
  inviteeIds: [ID!]!
  idempotencyKey: String!
}
input StartRecordingInput { callId: ID! idempotencyKey: String! }
input SearchInput {
  workspaceId: ID!
  text: String!
  types: [String!]! = ["MESSAGE", "FILE", "USER", "CHANNEL"]
  conversationIds: [ID!]
  from: DateTime
  to: DateTime
}
input AuditFilterInput {
  workspaceId: ID!
  actorId: ID
  actions: [String!]
  targetType: String
  from: DateTime
  to: DateTime
}

type Query {
  me: User!
  sessions(first: Int = 20, after: String): SessionConnection!
  workspaces: [Workspace!]!
  workspace(id: ID!): Workspace
  members(workspaceId: ID!, first: Int = 50, after: String): MembershipConnection!
  roles(workspaceId: ID!): [Role!]!
  teams(workspaceId: ID!): [Team!]!
  conversations(workspaceId: ID!, first: Int = 50, after: String): ConversationConnection!
  conversation(id: ID!): Conversation
  messages(conversationId: ID!, first: Int = 50, after: String): MessageConnection!
  thread(rootMessageId: ID!, first: Int = 50, after: String): MessageConnection!
  file(id: ID!): File
  notifications(workspaceId: ID, unreadOnly: Boolean = false,
                first: Int = 50, after: String): NotificationConnection!
  presence(workspaceId: ID!, userIds: [ID!]!): [Presence!]!
  call(id: ID!): Call
  activeCall(conversationId: ID!): Call
  search(input: SearchInput!, first: Int = 50, after: String): SearchConnection!
  auditEvents(filter: AuditFilterInput!, first: Int = 50,
              after: String): AuditEventConnection!
  adminDashboard(workspaceId: ID!): AdminDashboard!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  refreshSession: AuthPayload!
  logout(sessionId: ID): Boolean!
  updateProfile(input: UpdateProfileInput!): UserPayload!
  revokeSession(sessionId: ID!): Boolean!
  revokeAllSessions(userId: ID!): Int!

  createWorkspace(input: CreateWorkspaceInput!): WorkspacePayload!
  inviteMember(input: InviteMemberInput!): InvitationPayload!
  acceptInvitation(token: String!, idempotencyKey: String!): MembershipPayload!
  changeMemberRole(input: ChangeMemberRoleInput!): MembershipPayload!
  deactivateMember(workspaceId: ID!, membershipId: ID!,
                   actionId: String!): MembershipPayload!
  createTeam(workspaceId: ID!, name: String!, description: String,
             idempotencyKey: String!): TeamPayload!
  assignTeamMember(teamId: ID!, membershipId: ID!, active: Boolean!): TeamPayload!
  upsertRole(workspaceId: ID!, roleId: ID, code: String!, name: String!,
             permissionCodes: [String!]!, expectedVersion: Long): RolePayload!
  updateWorkspacePolicy(input: UpdateWorkspacePolicyInput!): PolicyPayload!

  createConversation(input: CreateConversationInput!): ConversationPayload!
  addConversationMember(conversationId: ID!, userId: ID!): ConversationPayload!
  archiveConversation(conversationId: ID!, expectedVersion: Long!,
                      actionId: String!): ConversationPayload!
  sendMessage(input: SendMessageInput!): MessagePayload!
  editMessage(input: EditMessageInput!): MessagePayload!
  deleteMessage(messageId: ID!, expectedVersion: Long!,
                idempotencyKey: String!): MessagePayload!
  markRead(input: MarkReadInput!): ReadStatePayload!
  setReaction(input: SetReactionInput!): MessagePayload!
  pinMessage(messageId: ID!, active: Boolean!): MessagePayload!

  createUpload(input: CreateUploadInput!): UploadPayload!
  finalizeUpload(input: FinalizeUploadInput!): FilePayload!
  deleteFile(fileId: ID!, reason: String!, idempotencyKey: String!): FilePayload!
  updateNotificationPreference(input: NotificationPreferenceInput!): PreferencePayload!
  markNotificationRead(id: ID!, read: Boolean!): NotificationPayload!

  startCall(input: StartCallInput!): CallPayload!
  joinCall(callId: ID!, idempotencyKey: String!): CallJoinPayload!
  leaveCall(callId: ID!, reason: String): CallPayload!
  endCall(callId: ID!, reason: String!, idempotencyKey: String!): CallPayload!
  startRecording(input: StartRecordingInput!): RecordingPayload!
  stopRecording(recordingId: ID!, idempotencyKey: String!): RecordingPayload!
}

type Subscription {
  messageEvents(conversationId: ID!): MessageEvent!
  presenceEvents(workspaceId: ID!, userIds: [ID!]): PresenceEvent!
  notificationEvents(workspaceId: ID): NotificationEvent!
  callEvents(callId: ID, conversationId: ID): CallEvent!
}

type MessageEdge { cursor: String! node: Message! }
type MessageConnection { edges: [MessageEdge!]! pageInfo: PageInfo! }
type MembershipConnection { edges: [MembershipEdge!]! pageInfo: PageInfo! }
type SearchConnection { edges: [SearchEdge!]! pageInfo: PageInfo! }

type MessagePayload {
  message: Message
  errors: [OperationError!]!
  idempotencyKey: String
}
type AuthPayload {
  user: User
  session: Session
  accessToken: String
  errors: [OperationError!]!
}
type UploadPayload {
  file: File
  uploadId: ID
  uploadUrl: String
  requiredHeaders: JSON
  expiresAt: DateTime
  errors: [OperationError!]!
}
type CallJoinPayload {
  call: Call
  liveKitUrl: String
  liveKitToken: String
  tokenExpiresAt: DateTime
  errors: [OperationError!]!
}
type Device { id: ID! platform: String! name: String! trusted: Boolean! lastSeenAt: DateTime } 
type WorkspacePolicy { 
  workspaceId: ID! mfaRequired: Boolean! guestPolicy: JSON! 
  retentionDays: Int! fileRules: JSON! channelRules: JSON! version: Long! 
} 
type Team { id: ID! workspaceId: ID! name: String! description: String status: String! } 
type Permission { id: ID! code: String! scope: String! } 
type Attachment { id: ID! messageId: ID! file: File! } 
type ReactionSummary { emoji: String! count: Int! reactedByMe: Boolean! } 
type CallParticipant { user: User! status: String! joinedAt: DateTime leftAt: DateTime } 
type Invitation { id: ID! workspaceId: ID! status: String! expiresAt: DateTime! } 
type Recording { id: ID! callId: ID! fileId: ID status: String! } 
type ReadState { conversationId: ID! sequence: Long! } 
type NotificationPreference { 
  workspaceId: ID eventType: String! channel: String! enabled: Boolean! quietHours: JSON 
} 
type SearchResult { 
  sourceId: ID! sourceType: String! workspaceId: ID! title: String! 
  snippet: String sourceVersion: Long! 
} 
type AdminDashboard { 
  workspaceId: ID! totalMembers: Int activeMembers: Int pendingInvites: Int 
  channelCount: Int storageUsed: Long storageLimit: Long 
  messagesLast30Days: Long callsLast30Days: Long degradedServices: [String!]! 
} 
type MessageEvent { eventId: ID! eventType: String! conversationId: ID! messageId: ID! sequence: Long! } 
type PresenceEvent { eventId: ID! workspaceId: ID! presence: Presence! } 
type NotificationEvent { eventId: ID! notification: Notification! } 
type CallEvent { eventId: ID! eventType: String! call: Call! } 
type SessionEdge { cursor: String! node: Session! } 
type SessionConnection { edges: [SessionEdge!]! pageInfo: PageInfo! } 
type MembershipEdge { cursor: String! node: Membership! } 
type ConversationEdge { cursor: String! node: Conversation! } 
type ConversationConnection { edges: [ConversationEdge!]! pageInfo: PageInfo! } 
type NotificationEdge { cursor: String! node: Notification! } 

type NotificationConnection { edges: [NotificationEdge!]! pageInfo: PageInfo! } 
type SearchEdge { cursor: String! node: SearchResult! } 
type AuditEventEdge { cursor: String! node: AuditEvent! } 
type AuditEventConnection { edges: [AuditEventEdge!]! pageInfo: PageInfo! } 
type UserPayload { user: User errors: [OperationError!]! idempotencyKey: String } 
type WorkspacePayload { workspace: Workspace errors: [OperationError!]! idempotencyKey: String } 
type InvitationPayload { invitation: Invitation errors: [OperationError!]! idempotencyKey: String } 
type MembershipPayload { membership: Membership errors: [OperationError!]! idempotencyKey: String } 
type TeamPayload { team: Team errors: [OperationError!]! idempotencyKey: String } 
type RolePayload { role: Role errors: [OperationError!]! idempotencyKey: String } 
type PolicyPayload { policy: WorkspacePolicy errors: [OperationError!]! idempotencyKey: String } 
type ConversationPayload { conversation: Conversation errors: [OperationError!]! idempotencyKey: String } 
type ReadStatePayload { readState: ReadState errors: [OperationError!]! idempotencyKey: String } 
type FilePayload { file: File errors: [OperationError!]! idempotencyKey: String } 
type PreferencePayload { preference: NotificationPreference errors: [OperationError!]! idempotencyKey: 
String } 
type NotificationPayload { notification: Notification errors: [OperationError!]! idempotencyKey: String } 
type CallPayload { call: Call errors: [OperationError!]! idempotencyKey: String } 
type RecordingPayload { recording: Recording errors: [OperationError!]! idempotencyKey: String } 
 
